name: Bug report
description: Report a reproducible viewer or build problem.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal student information, or private room media.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Include the room, view mode, browser, and smallest reliable sequence.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release, if known.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove private data before attaching anything.
